name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HWR-LEARN-v1.1.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWR-LEARN-app-debug
          path: HWR-LEARN-v1.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "HWR-LEARN v1.1.0 (SQLite Persistence, File Append, Reset & Touch Teaching)"
          body: |
            ### HWR-LEARN v1.1.0 Android (.apk)
            - **SQLite Persistence**: Taught samples are now permanently saved in SQLite (`hwrlearn.db`) and restored automatically every time the app opens.
            - **Text File Operations**: New **Append .txt** feature with automatic `.bak` backup creation and UTF-8 encoding.
            - **Reset Learning**: New **Reset** button to wipe taught SQLite samples and restore factory defaults.
            - **Quick Share & Clipboard**: New **Share** button to copy text and send directly to any messaging/notes app.
            - **Touch-Optimized Recognition**: Improved bank matching tolerance and perceptron updates for touchscreen handwriting.
            
            **Installation:**
            1. Download `HWR-LEARN-v1.1.0.apk` below on your Android phone.
            2. Tap the downloaded file and select **Install / Update**.
          files: HWR-LEARN-v1.1.0.apk
            1. Download `HWR-LEARN-v1.0.0.apk` below on your Android phone.
            2. Tap the downloaded file and select **Install**.
          files: HWR-LEARN-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
