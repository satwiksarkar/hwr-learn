name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HWR-LEARN-v1.2.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWR-LEARN-app-debug
          path: HWR-LEARN-v1.2.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "HWR-LEARN v1.2.0 (Exact Case Display, Save & Append .txt, FileProvider & Direct Downloads)"
          body: |
            ### HWR-LEARN v1.2.0 Android (.apk)
            - **Exact Lowercase / Uppercase Display**: Fixed Android Button auto-capitalization (`textAllCaps=false`). Lowercase recognized characters ('a', 'b', etc.) now properly display in lowercase inside the green/amber pills!
            - **Save vs Append .txt**: Added distinct **Save .txt** (overwrite/new file) and **Append .txt** (add to bottom) with `.bak` safety backup support.
            - **Direct Phone Storage (`Downloads/HWR-LEARN/`)**: Files are now saved directly into your phone's public `Downloads/HWR-LEARN/` directory so you can see them immediately in your phone's Files or Downloads app.
            - **Open & Share File Directly**: After saving, tap **Open File** to open directly in your phone's text editor, or **Share File** to send the `.txt` document to WhatsApp, Gmail, Drive, etc.
            
            **Installation:**
            1. Download `HWR-LEARN-v1.2.0.apk` below on your Android phone.
            2. Tap the downloaded file and select **Install / Update**.
          files: HWR-LEARN-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
